[project]
authors = [
    {name = "Dmitry Marchuk", email = "marchuk.d13@gmail.com"},
]
license = {text = "MIT"}
requires-python = "<4.0,>=3.11"
dependencies = [
    "pydantic-settings<3.0.0,>=2.16.3",
    "google-cloud-secret-manager<3.0.0,>=2.32.0",
]
name = "pydantic-secrets"
version = "0.2.1"
description = "The library is designed for extending your BaseSettings config class to load secrets from a secret manager"
readme = "README.md"

[dependency-groups]
dev = [
    "black<27.0.0,>=26.10.1",
    "ruff<1.0.0,>=0.17.5",
    "pyright>=1.1.414,<2.0.0",
    "pytest<10.0.0,>=9.2.0",
    "coverage<8.0.0,>=7.17.3",
    "pytest-mock>=3.17.0,<4.0.0",
]

[tool.pdm.build]
includes = ["pydantic_secrets"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
line-length = 120
src = ["./"]
lint.extend-select = [
    "I",
    "F",
    "N",
    "UP",
]

[tool.black]
line-length = 120

[tool.pyright]
ignore = [
    "tests/*",
    "snippets/*",
    "pydantic_secrets/protocols.py",
]
